<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Win Shearr | Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html"><img src="logo-reference.png"><div><strong>WIN SHEARR SCRAPPERS</strong><small>ADMIN DASHBOARD</small></div></a><a class="phone" href="index.html">PUBLIC SITE</a></header><main class="process" style="min-height:100vh"><div class="section-tag">PRIVATE DASHBOARD</div><h2 style="margin-top:20px">Vehicle enquiries.</h2><section id="loginBox" style="max-width:500px;margin-top:40px"><form id="loginForm" class="quote-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="submit">LOGIN</button><p id="loginMessage" class="form-message"></p></form></section><section id="dashboard" style="display:none;margin-top:40px"><button id="logout" class="submit" style="max-width:180px">LOG OUT</button><div id="enquiries" style="margin-top:20px"></div></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";import"./config.js";const db=createClient(window.WS_CONFIG.supabaseUrl,window.WS_CONFIG.supabaseKey),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function load(){const{data,error}=await db.from("vehicle_enquiries").select("*").order("created_at",{ascending:false});$("#enquiries").innerHTML=error?`<p>${esc(error.message)}</p>`:(data||[]).map(x=>`<article style="background:#fff;border:1px solid #ccd5da;padding:20px;margin:12px 0"><b>${esc(x.customer_name)}</b><p>${esc(x.vehicle_type)} • ${esc(x.brand)} ${esc(x.model)} • ${esc(x.year||"")}</p><p>${esc(x.location)} • ${esc(x.phone)}</p><p>${esc(x.details)}</p></article>`).join("")||"<p>No enquiries yet.</p>"}$("#loginForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error){$("#loginMessage").textContent=error.message;return}$("#loginBox").style.display="none";$("#dashboard").style.display="block";load()};$("#logout").onclick=async()=>{await db.auth.signOut();location.reload()};</script></body></html>
