<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Win Shearr | Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html"><span>WS</span><div><b>WIN SHEARR</b><small>SCRAPPERS ADMIN</small></div></a><a class="nav-call" href="index.html">PUBLIC SITE</a></header><main class="section"><p class="eyebrow">PRIVATE DASHBOARD</p><h1 style="font-size:55px;letter-spacing:-.06em">Vehicle enquiries.</h1><section id="loginBox" style="max-width:500px"><form id="loginForm" class="quote-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">LOGIN</button><p id="loginMessage" class="form-message"></p></form></section><section id="dashboard" style="display:none"><div class="actions"><button id="logout" class="btn ghost">LOG OUT</button></div><div id="enquiries"></div></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";import"./config.js";const db=createClient(window.WS_CONFIG.supabaseUrl,window.WS_CONFIG.supabaseKey),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function load(){const{data,error}=await db.from("vehicle_enquiries").select("*").order("created_at",{ascending:false});if(error){$("#enquiries").innerHTML="<p>"+esc(error.message)+"</p>";return}$("#enquiries").innerHTML=(data||[]).map(x=>`<article style="border:1px solid #292929;padding:22px;margin:12px 0;background:#101010"><div style="display:flex;justify-content:space-between"><b>${esc(x.customer_name)}</b><span>${esc((x.status||"new").toUpperCase())}</span></div><p style="color:#999">${esc(x.vehicle_type)} • ${esc(x.brand)} ${esc(x.model)} • ${esc(x.year||"")}</p><p style="color:#888">${esc(x.location)} • ${esc(x.phone)}</p><p style="color:#777">${esc(x.details)}</p></article>`).join("")||"<p>No enquiries yet.</p>"}$("#loginForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error){$("#loginMessage").textContent=error.message;return}$("#loginBox").style.display="none";$("#dashboard").style.display="block";load()};$("#logout").onclick=async()=>{await db.auth.signOut();location.reload()};</script></body></html>
